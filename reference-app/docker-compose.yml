services:
  # ---------------------------------------------------------------------------
  # HAPI FHIR R4 Server
  # ---------------------------------------------------------------------------
  hapi:
    image: hapiproject/hapi:latest
    container_name: ogca-hapi
    ports:
      - "8080:8080"
    environment:
      - hapi.fhir.fhir_version=R4
      - hapi.fhir.allow_external_references=true
      - hapi.fhir.allow_multiple_delete=true
      - hapi.fhir.cors.allow_credentials=true
      - hapi.fhir.cors.allowed_origin=*
    volumes:
      - hapi-data:/data/hapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fhir/metadata"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  # ---------------------------------------------------------------------------
  # Hub — Knowledge Artifact Repository + Reference Implementation Entry Point (port 4000)
  # ---------------------------------------------------------------------------
  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    container_name: ogca-hub
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CRD_SERVICE_URL=http://crd-service:4003

  # ---------------------------------------------------------------------------
  # EHR (port 4001)
  # ---------------------------------------------------------------------------
  ehr:
    build:
      context: .
      dockerfile: apps/ehr/Dockerfile
    container_name: ogca-ehr
    ports:
      - "4001:4001"
    environment:
      - FHIR_BASE_URL=http://hapi:8080/fhir
      - JANE_SMITH_PATIENT_ID=jane-smith
      - SMART_AUTH_BYPASS=true
      - PORT=4001
      - NEXT_PUBLIC_CRD_SERVICE_URL=http://localhost:4003
      - NEXT_PUBLIC_EHR_BASE_URL=http://localhost:4001
      - PAS_SERVICE_URL=http://pas-service:4005
    depends_on:
      hapi:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # CDS SMART App (port 4002)
  # ---------------------------------------------------------------------------
  smart-app:
    build:
      context: .
      dockerfile: apps/smart-app/Dockerfile
    container_name: ogca-smart-app
    ports:
      - "4002:4002"
    environment:
      - SMART_AUTH_BYPASS=true
      - PORT=4002
      - NEXT_PUBLIC_EHR_BASE_URL=http://localhost:4001
      - EHR_FHIR_BASE_URL=http://ehr:4001/api/fhir
      - KNOWLEDGE_REPO_URL=http://hub:4000

  # ---------------------------------------------------------------------------
  # CRD Service (port 4003)
  # ---------------------------------------------------------------------------
  crd-service:
    build:
      context: .
      dockerfile: apps/crd-service/Dockerfile
    container_name: ogca-crd-service
    ports:
      - "4003:4003"
    environment:
      - SMART_AUTH_BYPASS=true
      - PORT=4003
      - DTR_CLIENT_URL=http://dtr-client:4004
      - EHR_FHIR_BASE_URL=http://ehr:4001/api/fhir
      - KNOWLEDGE_REPO_URL=http://hub:4000

  # ---------------------------------------------------------------------------
  # DTR Client (port 4004)
  # ---------------------------------------------------------------------------
  dtr-client:
    build:
      context: .
      dockerfile: apps/dtr-client/Dockerfile
    container_name: ogca-dtr-client
    ports:
      - "4004:4004"
    environment:
      - SMART_AUTH_BYPASS=true
      - PORT=4004
      - EHR_FHIR_BASE_URL=http://ehr:4001/api/fhir
      - EHR_BASE_URL=http://localhost:4001
      - KNOWLEDGE_REPO_URL=http://hub:4000

  # ---------------------------------------------------------------------------
  # PAS Service (port 4005)
  # ---------------------------------------------------------------------------
  pas-service:
    build:
      context: .
      dockerfile: apps/pas-service/Dockerfile
    container_name: ogca-pas-service
    ports:
      - "4005:4005"
    environment:
      - SMART_AUTH_BYPASS=true
      - PORT=4005
      - PAYER_BACKEND_URL=http://payer-backend:4006

  # ---------------------------------------------------------------------------
  # Payer Backend (port 4006)
  # ---------------------------------------------------------------------------
  payer-backend:
    build:
      context: .
      dockerfile: apps/payer-backend/Dockerfile
    container_name: ogca-payer-backend
    ports:
      - "4006:4006"
    environment:
      - SMART_AUTH_BYPASS=true
      - PORT=4006
      - EHR_FHIR_BASE_URL=http://ehr:4001/api/fhir

volumes:
  hapi-data:
